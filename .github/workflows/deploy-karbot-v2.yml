name: Deploy Karbot Landing v2

# Custom workflow que evita el lock del workflow anterior (deploy-landing-karbot.yml)
# atascado durante GitHub Actions outage 2026-08-06.
# Corre en ubuntu-latest normal + actions/deploy-pages@v4 (Pages workflow custom).

on:
  push:
    branches: [main]
    paths:
      - 'clients/karbot/**'
      - '.github/workflows/deploy-karbot-v2.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: karbot-pages-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare _site from clients/karbot
        run: |
          mkdir -p _site
          rsync -av --exclude 'worker/' --exclude '*.md' clients/karbot/ _site/
          echo "landing.karbot.mx" > _site/CNAME
          echo "=== _site tree ==="
          find _site -maxdepth 2 -type f | head -30
          echo "=== Total files ==="
          find _site -type f | wc -l

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
