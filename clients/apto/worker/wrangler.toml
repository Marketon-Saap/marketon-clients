name = "apto-landing-api"
main = "src/index.js"
compatibility_date = "2026-07-26"

# Vars públicas · pipeline + form IDs (no son secretos)
[vars]
ALLOWED_ORIGIN = "https://landing.apto.mx,https://mktgrupoplasenciaautomotriz.github.io"
HUBSPOT_PORTAL_ID = "2583031"
# Form destino Forms API v3 · "Formulario Apto WEB" (form principal apto.mx)
# 2026-08-11: consolidado a 696bbd9e después de desactivar reCAPTCHA en HubSpot UI.
# Ambos forms (apto.mx/contacto/ nativo + landing.apto.mx vía Worker) caen al mismo
# submissions view. Legacy form "APTO Landing Madre" (6f9db620) queda archivado.
HUBSPOT_FORM_ID = "696bbd9e-ca44-410c-a474-af764b0e643a"
HUBSPOT_PIPELINE_ID = "922134387"
HUBSPOT_DEAL_STAGE_NEW_LEAD = "1407911441"
DEFAULT_LIFECYCLE_STAGE = "lead"
# Multi-recipient (comma-separated) · 5 destinatarios APTO + Marketon
NOTIFICATION_EMAIL_TO = "chucho@marketon.mx,chucho@apto.mx,alvaro@apto.mx,carlosbeltran@apto.mx,alejandro@apto.mx"
NOTIFICATION_EMAIL_FROM = "APTO Landing <no-reply@marketon.mx>"

# Cloudflare D1 · safety net + lead persistence + queries analytics
[[d1_databases]]
binding = "APTO_LEADS_DB"
database_name = "apto-leads"
database_id = "7868f2ee-7419-45be-a900-ea0bd19fbd40"

# Secrets (NO poner aquí · se configuran con `wrangler secret put NAME`):
#   HUBSPOT_TOKEN          — HubSpot Private App token (crm.objects.contacts+deals write)
#   META_ACCESS_TOKEN      — Meta CAPI access token (Pixel 721335916342252) · opcional
#   META_TEST_EVENT_CODE   — Meta CAPI test event code para debug · opcional
#   GA4_MEASUREMENT_ID     — GA4 property (G-XXXXXXX) · opcional
#   GA4_API_SECRET         — GA4 Measurement Protocol API secret · opcional
#   RESEND_API_KEY         — Resend.com API key para email notify · opcional
