name = "karbot-landing-api"
main = "src/index.js"
compatibility_date = "2026-07-26"

# Vars públicas (no secretos) · booking rules editables sin re-deploy secrets
[vars]
ISABEL_CALENDAR_ID = "isabel@karlo.io"
ALLOWED_ORIGIN = "https://mktgrupoplasenciaautomotriz.github.io"
BUSINESS_HOURS_START = "10"
BUSINESS_HOURS_END = "18"
SLOT_MINUTES = "30"
BUFFER_MINUTES = "15"
TIMEZONE = "America/Mexico_City"
DAYS_OF_WEEK = "1,2,3,4,5"
NOTIFY_EMAILS = "isabel@karlo.io,chucho@marketon.mx,diego@karlo.io,alejandro@karlo.io"
NOTIFY_FROM = "Karbot Landing <chucho@marketon.mx>"

# D1 · safety net de leads (todo submit se guarda aquí, aunque Calendar/Gmail fallen)
[[d1_databases]]
binding = "karbot_leads"
database_name = "karbot-leads"
database_id = "b0877096-ce20-4aaf-ae1f-5051aa504a0f"

# Secrets (NO poner aquí · se configuran con `wrangler secret put NAME`):
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   GOOGLE_CALENDAR_REFRESH_TOKEN  · Isabel autoriza · /oauth/start?service=calendar
#   GOOGLE_GMAIL_REFRESH_TOKEN     · Chucho autoriza · /oauth/start?service=gmail
